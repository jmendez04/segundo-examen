<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Productos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <header class="topbar">
        <h1>Gestión de Productos</h1>
    </header>

    <main class="container">

        {% with mensajes = get_flashed_messages() %}
            {% if mensajes %}
                <div class="flash">
                    {% for m in mensajes %}
                        <p>{{ m }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
